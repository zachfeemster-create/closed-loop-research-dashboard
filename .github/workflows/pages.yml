name: Deploy research dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only public website assets
        run: |
          mkdir -p site/data
          cp index.html live.js .nojekyll site/
          cp data/run_index.json site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - id: deployment
        uses: actions/deploy-pages@v4