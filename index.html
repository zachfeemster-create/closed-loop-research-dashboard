function diffComputation(left,right){if(!left||!right)return null;const a=new Map((left.snapshots||[]).map(s=>[s.key,s]));const b=new Map((right.snapshots||[]).map(s=>[s.key,s]));const keys=[...new Set([...a.keys(),...b.keys()])].sort();const full=!!left.complete&&!!right.complete;const rows=keys.map(key=>{const x=a.get(key),y=b.get(key);let changes=[];if(!x&&y)changes.push(full?'Added':'Newly observed');if(x&&!y)changes.push(full?'Dropped':'Not observed');if(x&&y){if((x.classification||'')!==(y.classification||''))changes.push('Reclassified');if(hasVal(x.streak)&&hasVal(y.streak)&&Number.isFinite(Number(x.streak))&&Number.isFinite(Number(y.streak))){if(Number(y.streak)>Number(x.streak))changes.push('Streak ↑');if(Number(y.streak)<Number(x.streak))changes.push('Streak ↓')}if(hasVal(x.score)&&hasVal(y.score)&&String(x.score)!==String(y.score))changes.push('Score changed')}if(!changes.length)changes=['Unchanged'];return {key,x,y,changes}});return {rows,full,stats:{added:rows.filter(r=>r.changes.includes('Added')).length,dropped:rows.filter(r=>r.changes.includes('Dropped')).length,classes:rows.filter(r=>r.changes.includes('Reclassified')).length,streak:rows.filter(r=>r.changes.some(s=>s.startsWith('Streak'))).length}}}
function compareView(){let runs=db.runs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!compare.right)compare.right=runs[0]?.id||'';if(!compare.left)compare.left=runs.find(r=>r.id!==compare.right)?.id||'';const l=record('runs',compare.left),r=record('runs',compare.right),diff=diffComputation(l,r);const opt=id=>`<option value="">Select run…</option>${runs.map(x=>`<option value="${esc(x.id)}" ${x.id===id?'selected':''}>${esc(x.label)}</option>`).join('')}`;const tile=(run,title)=>`<div class="card compare-tile"><div class="caps">${esc(title)}</div>${run?`<div class="run-name">${esc(run.label)}</div><div class="run-meta">${getDate(run.date)} · ${esc(run.sha?short(run.sha,12):'No commit attached')}</div><div class="row-meta">${pill(run.complete?'Complete':'Partial',run.complete?'green':'amber')}${pill(run.status)}</div><div class="stat-row"><div><span>Snapshot rows</span><strong>${run.snapshots?.length||0}</strong></div><div><span>Baseline</span><strong>${fmt(run.baselineScore)}</strong></div><div><span>Submission</span><strong>${fmt(run.submissionScore)}</strong></div></div>`:`<div class="empty" style="padding:24px 8px"><p>Choose a run to compare.</p></div>`}</div>`;return head('Nightly diffs','Compare two complete run snapshots without confusing missing data with eliminated survivors.',btn('New run','new-run','plus'))+`<section class="card card-pad"><div class="toolbar" style="margin:0"><div class="compare-selects"><div><div class="caps muted" style="margin-bottom:5px">Baseline</div><select id="diffLeft" aria-label="Baseline run">${opt(compare.left)}</select></div><div class="vs" style="margin-top:18px">VS</div><div><div class="caps muted" style="margin-bottom:5px">Candidate</div><select id="diffRight" aria-label="Candidate run">${opt(compare.right)}</select></div></div>${btn('Export diff CSV','export-diff','download','button',diff?'':'disabled')}</div></section><div class="grid cols-2 section-gap">${tile(l,'Before / reference')}${tile(r,'After / candi function modal(title,content,submit='Save changes'){const d=document.getElementById('editDialog');d.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button type="button" class="xbtn" data-action="close-dialog" aria-label="Close">×</button></div>${content}`;d.showModal();return d}
function renderField(f,v){const [key,label,type,required,options]=f;let input='';const attrs=`name="${esc(key)}" ${required?'required':''}`;if(type==='textarea')input=`<textarea ${attrs} rows="3">${esc(v||'')}</textarea>`;else if(type==='select')input=`<select ${attrs}>${(options||[]).map(([id,name])=>`<option value="${esc(id)}" ${String(v)===String(id)?'selected':''}>${esc(name)}</option>`).join('')}</select>`;else if(type==='checkbox')input=`<label style="display:flex;align-items:center;gap:9px;font-size:13px;color:#344862;margin-top:10px"><input type="checkbox" name="${esc(key)}" ${v?'checked':''} style="width:17px;height:17px"> Yes, full manifest entered; omissions can be interpreted as drops</label>`;else input=`<input class="input" type="${type}" ${attrs} value="${esc(v||'')}" ${type==='number'?'step="1"':''}>`;return `<div class="form-field ${type==='textarea'||type==='checkbox'?'wide':''}">${type==='checkbox'?'':`<label>${esc(label)}${required?' *':''}</label>`}${input}${key==='complete'?'<div class="field-help">Mark complete only when the source contains all eligible survivors for that run.</div>':''}</div>`}
function editRecord(type,id=''){const old=id?record(type,id):null;const data=old||{id:uid()};const props=fields[type];if(!props)return;const form=`<form id="recordForm" data-type="${type}" data-id="${esc(id)}"><div class="dialog-body"><div class="form-grid">${props.map(f=>renderField(f,data[f[0]])).join('')}</div>${old?`<div class="form-sep"></div><p class="tagline mono">Internal ID: ${esc(old.id)}</p>`:''}</div><div class="dialog-footer">${old&&type!=='runs'?`<button type="button" class="button danger" data-action="delete" data-type="${esc(type)}" data-id="${esc(id)}" style="margin-right:auto">${ic('trash-2')} Delete</button>`:''}<button type="button" class="button" data-action="close-dialog">Cancel</button><button type="submit" class="button primary">${old?'Save changes':'Create '+singular[type]}</button></div></form>`;modal(`${old?'Edit':'New'} ${singular[type]}`,form)}
function persistRecord(form){const type=form.dataset.type,id=form.dataset.id;let data=id?{...record(type,id)}:{id:uid()};if(!data.id)return toast('Cannot find this record');for(const f of fields[type]){const k=f[0],t=f[2],el=form.elements[k];data[k]=t==='checkbox'?!!el.checked:String(el.value||'').trim();}if(type==='runs'){data.snapshots=data.snapshots||[];if(!id&&data.complete&&!data.snapshots.length){data.complete=false;toast('New run created partial; import complete survivor manifest before marking complete.')}}if(!id)db[type].push(data);else db[type]=db[type].map(x=>x.id===id?data:x);if(type==='runs')detailRun=data.id;save();document.getElementById('editDialog').close();render();toast(`${singular[type]} saved`)}
function snapshotModal(runId,key=''){const run=record('runs',runId);if(!run)return toast('Choose a run first');const old=key?(run.snapshots||[]).find(s=>s.key===key):null;const data=old||{};const form=`<form id="snapshotForm" data-run="${esc(runId)}" data-old-key="${esc(key)}"><div class="dialog-body"><div class="info-block" style="margin-bottom:18px">${esc(run.label)} · A snapshot row is a scoped observation in this run. Use the same stable key in every nightly for accurate comparisons.</div><div class="form-grid">${[['key','Stable survivor key','text',true],['label','Name','text',true],['classification','Classification','select',false,classOpts],['streak','Streak length','number'],['score','Score (optional)','text'],['confidence','Confidence / controls','text'],['notes','Observed change / caveats','textarea']].map(f=>renderField(f,data[f[0]])).join('')}</div></div><div class="dialog-footer"><button type="button" class="button" data-action="close-dialog">Cancel</button><button type="submit" class="button primary">Save snapshot row</button></div></form>`;modal(old?'Edit snapshot':'Add snapshot entry',form)}
function pasteModal(runId){const run=record('runs',runId);if(!run)return toast('Select a run');const inner=`<form id="bulkForm" data-run="${esc(runId)}"><div class="dialog-body"><p class="description">Paste JSON snapshot rows or CSV with columns <span class="mono">key,label,classification,streak,score,confidence,notes</span>. Rows merge by stable key; existing keys are replaced. A run is <strong>not</strong> marked complete automatically.</p><textarea style="width:100%;min-height:230px;font-family:monospace;font-size:11px" name="payload" required placeholder='[{"key":"band-a","label":"Band A","classification":"q3","streak":2}]'></textarea><div class="field-help">Accepts a JSON array, an object with a "survivors" or "snapshots" array, or a CSV header and rows. Q1–Q5 are valid classification keys.</div></div><div class="dialog-footer"><button type="button" class="button" data-action="close-dialog">Cancel</button><button type="submit" class="button primary">Import rows</button></div></form>`;modal('Import '+run.label+' survivor manifest',inner)}
function parseCSV(s){const rows=[];let row=[],val='',inQuote=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'&&inQuote&&s[i+1]==='"'){val+='"';i++;continue}if(c==='"'){inQuote=!inQuote;continue}if(c===','&&!inQuote){row.push(val);val='';continue}if((c==='\n'||c==='\r')&&!inQuote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(val);if(row.some(v=>v.trim()))rows.push(row);row=[];val='';continue}val+=c}row.push(val);if(row.some(v=>v.trim()))rows.push(row);const headers=rows.shift()?.map(x=>x.trim().toLowerCase());if(!headers||!headers.includes('key'))throw Error('CSV needs a key header');return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])))}
function normalizeSnapshot(s){if(!s||typeof s!=='object')return null;const key=String(s.key??s.id??s.survivor_id??'').trim();if(!key)return null;const known=Object.keys(statusLabels);let c=String(s.classification??s.class??s.status??'unclassified').toLowerCase().trim();if(c.startsWith('q')&&c.length>=2)c=c.slice(0,2);if(!known.includes(c))c='unclassified';return {key,label:String(s.label??s.name??s.title??key).trim(),classification:c,streak:hasVal(s.streak)?String(s.streak):'',score:hasVal(s.score)?String(s.score):'',confidence:String(s.confidence??''),notes:String(s.notes??'')}}
function bulkImport(form){const run=record('runs',form.dataset.run);if(!run)return;const payload=form.elements.payload.value.trim();let parsed;try{parsed=payload.startsWith('[')||payload.startsWith('{')?JSON.parse(payload):parseCSV(payload);if(!Array.isArray(parsed))parsed=parsed.survivors||parsed.snapshots;if(!Array.isArray(parsed))throw Error('No snapshot array found');const rows=parsed.map(normalizeSnapshot).filter(Boolean);if(!rows.length)throw Error('No entries have stable keys');const map=new Map((run.snapshots||[]).map(s=>[s.key,s]));rows.forEach(s=>map.set(s.key,s));run.snapshots=[...map.values()];run.status='captured';save();document.getElementById('editDialog').close();detailRun=run.id;render();toast(`Imported ${rows.length} rows into ${run.label}. Snapshot remains ${run.complete?'complete':'partial'}.`)}catch(e){toast('Import error: '+e.message)}}
function updateSnapshot(form){const run=record('runs',form.dataset.run);if(!run)return;let data={};for(const f of ['key','label','classification','streak','score','confidence','notes'])data[f]=String(form.elements[f]?.value||'').trim();if(!data.key||!data.label)return toast('Key and name required');run.snapshots=run.snapshots||[];const dup=run.snapshots.some(s=>s.key===data.key&&s.key!==form.dataset.oldKey);if(dup)return toast('Stable key already exists in this run');if(form.dataset.oldKey)run.snapshots=run.snapshots.filter(s=>s.key!==form.dataset.oldKey);run.snapshots.push(data);save();document.getElementById('editDialog').close();detailRun=run.id;render();toast('Snapshot updated')}
function promptImport(){document.getElementById('fileImport').click()}
function importData(file){const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.runs)||!Array.isArray(d.prs)||!Array.isArray(d.evidence))throw Error('Missing required collections');const keys=['runs','survivors','prs','tests','hypotheses','evidence','actions'];const ok=keys.every(k=>Array.isArray(d[k]));if(!ok)throw Error('Invalid or incomplete research store');if(!confirm(`Replace this browser's data with ${d.runs.length} runs and ${d.evidence.length} evidence records from this backup? Export your current data first if needed.`))return;db=d;save();detailRun=db.runs[0]?.id||'';compare={left:'',right:''};render();toast('Backup restored')}catch(e){toast('Invalid backup: '+e.message)}};rd.readAsText(file)}
const csvSafe=v=>'"'+String(v??'').replaceAll('"','""')+'"';
function toCSV(rows,headers){return [headers.join(','),...rows.map(r=>headers.map(h=>csvSafe(r[h])).join(','))].join('\r\n')}
function evidenceMarkdown(){
 const h=['# Closed Loop · Research Evidence Dossier','',`Exported ${new Date().toISOString()}`,'','> Caution: recaps, user-reported nightly events, and unverifiable PR states remain provisional until supported by direct source artifacts.',''];
 h.push('## Nightly runs','');
 for(const r of db.runs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))){h.push(`### ${r.label} (${r.date||'undated'})`,`**Manifest:** ${r.complete?'Complete':'Partial / unknown'} · **SHA:** ${r.sha||'not recorded'} · **Source:** ${r.source||'not recorded'}`,'',r.summary||'No run summary','',`Snapshot entries: ${(r.snapshots||[]).length}`,'');for(const s of r.snapshots||[])h.push(`- ${s.key}: ${s.label||s.key}; class ${s.classification||'unclassified'}; streak ${s.streak||'unknown'}; score ${s.score||'unknown'}`);h.push('')}
 h.push('## Verification tests','');for(const t of db.tests){h.push(`### ${t.name} — ${t.status}`,`Date: ${t.date||'unknown'} · Scope: ${t.scope||'not set'} · Source: ${t.source||'not entered'}`,'',`**Expected:** ${t.expected||'not entered'}`,'',`**Observed:** ${t.observed||'not entered'}`,'',`**Limitations:** ${t.notes||'none noted'}`,'')}
 h.push('## PR regression watch','');for(const p of db.prs){h.push(`### PR #${p.number}: ${p.title}`,`Status: ${p.status||'unverified'} · Risk: ${p.risk||'review needed'}`,'',p.summary||'',`**Regression-risk note:** ${p.regression||'not assessed'}`,`**Checks:** ${p.tests||'not specified'}`,'')}
 h.push('## Hypothesis register','');for(const h0 of db.hypotheses){h.push(`### ${h0.title} — ${statusLabels[h0.classification]||h0.classification||'unclassified'}`,h0.claim||'',`**Protocol:** ${h0.protocol||'not entered'}`,`**Controls:** ${h0.controls||'not entered'}`,`**Closure criterion:** ${h0.kill||'not entered'}`,`**Next check:** ${h0.followup||'not entered'}`,'')}
 h.push('## Timestamped evidence ledger','');for(const e of db.evidence.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))){h.push(`### ${e.date||'Undated'} — ${e.title}`,`**Type:** ${e.kind||'Unclassified'} · **Verification:** ${e.confidence||'Not evaluated'}`,`**Source:** ${e.source||'Not entered'}`);if(e.url)h.push(`**URL:** ${e.url}`);if(e.hash)h.push(`**Hash:** ${e.hash}`);if(e.link)h.push(`**Linked record:** ${e.link}`);h.push('',e.summary||'No summary','')}
 h.push('---','## Outstanding follow-up checks','');db.actions.filter(a=>a.status!=='done').forEach(a=>h.push(`- [ ] ${a.title} (${a.priority}, ${a.status}) — ${a.notes||''}`));h.push('');return h.join('\n')
}
function exportDiff(){const l=record('runs',compare.left),r=record('runs',compare.right),d=diffComputation(l,r);if(!d)return toast('Select two runs first');const rows=d.rows.map(x=>({key:x.key,label:x.y?.label||x.x?.label||x.key,before_class:x.x?.classification||'',after_class:x.y?.classification||'',before_streak:x.x?.streak||'',after_streak:x.y?.streak||'',before_score:x.x?.score||'',after_score:x.y?.score||'',change:x.changes.join('; '),complete_pair:d.full}));download(`closedloop-diff-${l.date||'before'}-to-${r.date||'after'}.csv`,toCSV(rows,['key','label','before_class','after_class','before_streak','after_streak','before_score','after_score','change','complete_pair']),'text/csv')}
function handleAction(el){const a=el.dataset.action,type=el.dataset.type,id=el.dataset.id;if(a==='new-run')return editRecord('runs');if(a.startsWith('new-'))return editRecord(a.slice(4));if(a.startsWith('nav-'))return navigate(a.slice(4));if(a==='edit')return editRecord(type,id);if(a==='edit-runnov')return editRecord('runs','run-nov2');if(a==='show-run'){detailRun=id;render();return}if(a==='snapshot')return pasteModal(id||detailRun);if(a==='add-snapshot')return snapshotModal(id||detailRun);if(a==='edit-snapshot')return snapshotModal(id,el.dataset.key);if(a==='delete-snapshot'){if(!confirm('Delete this snapshot row?'))return;const run=record('runs',id);run.snapshots=run.snapshots.filter(s=>s.key!==el.dataset.key);save();render();return}if(a==='done'||a==='reopen'){const item=record('actions',id);if(item){item.status=a==='done'?'done':'todo';save();render();toast('Action updated')}return}if(a==='close-dialog'){document.getElementById('editDialog').close();return}if(a==='delete'){if(!confirm('Delete this record? Linked evidence will not be erased.'))return;db[type]=db[type].filter(x=>x.id!==id);save();document.getElementById('editDialog').close();render();toast('Record deleted');return}if(a==='import')return promptImport();if(a==='export'){download('closedloop-research-backup-'+latestDate()+'.json',JSON.stringify(db,null,2));toast('JSON backup exported');return}if(a==='export-tests-csv'){download('closedloop-tests-'+latestDate()+'.csv',toCSV(db.tests,['id','name','scope','status','date','expected','observed','notes','source','runId','prId']),'text/csv');return}if(a==='export-runs-csv'){download('closedloop-runs-'+latestDate()+'.csv',toCSV(db.runs.map(r=>({...r,snapshot_count:r.snapshots?.length||0})),['id','date','label','branch','sha','status','source','summary','baselineScore','submissionScore','complete','snapshot_count']),'text/csv');return}if(a==='export-markdown'){download('closedloop-evidence-'+latestDate()+'.md',evidenceMarkdown(),'text/markdown');return}if(a==='export-evidence-csv'){download('closedloop-evidence-'+latestDate()+'.csv',toCSV(db.evidence,['id','date','kind','title','summary','source','url','hash','link','confidence']),'text/csv');return}if(a==='export-diff')return exportDiff()}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){navigate(n.dataset.nav);return}const a=e.target.closest('[data-action]');if(a)handleAction(a)});
document.addEventListener('submit',e=>{if(['recordForm','snapshotForm','bulkForm'].includes(e.target.id)){e.preventDefault();if(e.target.id==='recordForm')persistRecord(e.target);else if(e.target.id==='snapshotForm')updateSnapshot(e.target);else bulkImport(e.target)}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='diffLeft'){compare.left=e.target.value;render()}if(id==='diffRight'){compare.right=e.target.value;render()}const mapping={filterClassification:'classification',filterPrStatus:'prStatus',filterTestStatus:'testStatus',filterHypStatus:'hypStatus',filterEvidenceKind:'evidenceKind',filterActionStatus:'actionStatus'};if(mapping[id]){filters[mapping[id]]=e.target.value;render()}});
document.getElementById('fileImport').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){query=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('globalSearch');input.focus();input.setSelectionRange(pos,pos)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h)&&h!==view){view=h;render()}});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('globalSearch')?.focus()}if(e.key==='Escape'&&document.getElementById('editDialog').open)document.getElementById('editDialog').close()});
render();
</script>
